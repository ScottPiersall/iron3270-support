name: Bug report
description: Something in Iron 3270 doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Issues are public:** remove host names, IP addresses,
        user IDs and passwords from everything you paste. Security problems go by email instead:
        see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Iron 3270 version
      description: Shown in the Extensions view.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and version
      placeholder: VS Code 1.106, IBM Bob, VSCodium ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x64
        - Windows on ARM
        - Linux x64
        - Linux ARM64
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host system
      options:
        - z/OS (TSO/ISPF)
        - z/OS (CICS)
        - z/VM
        - MVS 3.8j (Hercules)
        - Other
        - Not connected / not relevant
  - type: dropdown
    id: tls
    attributes:
      label: TLS mode
      options:
        - "Off"
        - Verify certificate
        - Trusted CA file
        - Pinned certificate
        - Not relevant
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste error messages exactly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a connection with ...
        2. Connect, then ...
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log
      description: 'Command Palette, then "Iron 3270: Show Diagnostics Log". Replace host names and IP addresses before pasting.'
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed host names, IP addresses, user IDs and passwords from this report and any screenshots.
          required: true
